<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #container { width: 100%; height: 100%; }
</style>
<script src="g6.min.js"></script>
</head>
<body>
<div id="container"></div>
<script>
  var graph = null;

  function nodeSize(node) {
    var degree = Number(node.data && node.data.degree || 0);
    var pinnedBonus = node.data && node.data.pinned ? 5 : 0;
    return Math.min(24 + degree * 5 + pinnedBonus, 50);
  }

  function relationColor(kind) {
    return 'rgba(237,232,220,.38)';
  }

  function loadGraph(jsonText) {
    var payload = JSON.parse(jsonText);
    var nodes = payload.nodes.map(function(node) {
      var size = nodeSize({ data: node });
      return {
        id: node.id,
        type: node.shape,
        data: node,
        style: {
          size: size,
          fill: node.color,
          fillOpacity: 0,
          stroke: node.color,
          lineWidth: node.pinned ? 2 : 1.5,
          labelText: node.title,
          labelFill: '#F5F7FF',
          labelFontSize: Math.max(10, Math.min(12, 8 + size * .11)),
          labelFontWeight: node.pinned ? 600 : 400,
          labelPlacement: 'bottom',
          labelOffsetY: 6,
          labelBackground: true,
          labelBackgroundFill: 'rgba(9,15,30,0.72)',
          labelBackgroundRadius: 5,
          labelBackgroundOpacity: 0,
          shadowBlur: 0
        }
      };
    });
    var edges = payload.edges.map(function(edge) {
      return {
        source: edge.from,
        target: edge.to,
        data: edge,
        style: {
          stroke: relationColor(edge.kind),
          strokeOpacity: 0.38,
          lineWidth: 1,
          endArrow: true,
          endArrowSize: 5,
          labelText: edge.label,
          labelFill: 'rgba(245,247,255,0.68)',
          labelFontSize: 9,
          labelBackground: true,
          labelBackgroundFill: 'rgba(9,15,30,0.78)',
          labelBackgroundRadius: 4,
          labelOpacity: 0
        }
      };
    });
    var data = { nodes: nodes, edges: edges };

    if (!graph) {
      graph = new G6.Graph({
        container: 'container',
        data: data,
        autoFit: 'view',
        autoResize: true,
        animation: true,
        layout: {
          type: 'd3-force',
          animated: true,
          alphaDecay: 0.024,
          velocityDecay: 0.34,
          manyBody: {
            strength: function(node) { return -150 - Number(node.data.degree || 0) * 34; }
          },
          collide: {
            radius: function(node) { return nodeSize(node) / 2 + 10; },
            iterations: 3
          },
          link: {
            distance: function(edge) { return 108 + (1 - Number(edge.data.strength || .4)) * 82; },
            strength: function(edge) { return Number(edge.data.strength || .4); },
            iterations: 2
          },
          x: { strength: 0.012 },
          y: { strength: 0.012 }
        },
        node: {
          state: {
            selected: {
              fillOpacity: 0.46,
              lineWidth: 3,
              shadowBlur: 24,
              labelBackgroundOpacity: 1
            },
            active: {
              fillOpacity: 0.34,
              lineWidth: 2.3,
              labelBackgroundOpacity: 1
            },
            inactive: {
              fillOpacity: 0.05,
              strokeOpacity: 0.16,
              labelOpacity: 0.12
            }
          }
        },
        edge: {
          state: {
            selected: { stroke: '#EDE8DC', lineWidth: 2, labelOpacity: 1 },
            active: { strokeOpacity: 0.86, lineWidth: 1.5, labelOpacity: 1 },
            inactive: { strokeOpacity: 0.05, labelOpacity: 0 }
          }
        },
        behaviors: [
          'zoom-canvas',
          'drag-canvas',
          'auto-adapt-label',
          { type: 'drag-element-force', fixed: false },
          {
            type: 'click-select',
            degree: 1,
            state: 'selected',
            neighborState: 'active',
            unselectedState: 'inactive'
          }
        ]
      });

      graph.on('node:click', function(event) {
        var id = event.target && event.target.id;
        if (id) GraphTap.postMessage(String(id));
      });
      graph.render();
      return;
    }

    graph.setData(data);
    graph.render();
  }
</script>
</body>
</html>
